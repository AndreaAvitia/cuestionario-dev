<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario Desarrollo Seguro - PWA 🦇</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e24;
            --primary: #a855f7;
            --primary-hover: #c084fc;
            --success: #22c55e;
            --error: #ef4444;
            --text: #e0e0e0;
            --font-family: 'Segoe UI', system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: var(--font-family); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1rem; 
            margin: 0; 
            min-height: 100vh;
        }
        .container { 
            background: var(--surface); 
            padding: 1.25rem; 
            border-radius: 12px; 
            border: 1px solid #333; 
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.15); 
            width: 100%; 
            max-width: 700px; 
            text-align: center; 
        }
        @media (min-width: 768px) {
            body { padding: 2rem; }
            .container { padding: 2rem; }
        }
        h1 { color: var(--primary); font-size: 1.5rem; margin-top: 0.5rem; }
        @media (min-width: 768px) { h1 { font-size: 2rem; } }
        p.subtitle { color: #aaa; margin-bottom: 1.5rem; font-size: 0.95rem; }
        
        .drop-zone { 
            border: 2px dashed var(--primary); 
            padding: 30px 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            color: var(--primary); 
            transition: all 0.3s ease; 
            background: rgba(0,0,0,0.2); 
            margin-bottom: 20px; 
        }
        .drop-zone:hover { background: rgba(168, 85, 247, 0.1); border-color: var(--primary-hover); }
        
        .btn-action { 
            background: var(--primary); 
            color: #fff; 
            text-align: center; 
            border: none; 
            font-weight: bold; 
            font-size: 1rem; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s ease; 
            margin-bottom: 10px;
        }
        .btn-action:hover { background: var(--primary-hover); }
        
        .btn-secondary { 
            background: #333; 
            border: 1px solid var(--primary); 
            color: #fff; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s; 
            font-size: 0.95rem; 
            width: 100%; 
            margin-bottom: 10px;
        }
        .btn-secondary:hover { background: var(--primary); }
        
        .hidden { display: none !important; }
        
        .setup-list { max-height: 55vh; overflow-y: auto; padding-right: 5px; margin-bottom: 20px; text-align: left; }
        .setup-item { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 3px solid var(--primary); }
        .setup-question { font-weight: bold; margin-bottom: 8px; font-size: 1rem; }
        .setup-options { display: flex; flex-direction: column; gap: 6px; }
        .setup-options label { cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: flex-start; font-size: 0.9rem; word-break: break-word; }
        .setup-options label:hover { background: rgba(168, 85, 247, 0.1); }
        .setup-options input { margin-right: 8px; margin-top: 3px; accent-color: var(--primary); flex-shrink: 0; }
        
        .score-panel { text-align: center; font-size: 0.95rem; margin-bottom: 1rem; color: var(--primary-hover); font-weight: bold; }
        h2.question-text { font-size: 1.1rem; margin-bottom: 1.2rem; line-height: 1.4; text-align: left; word-break: break-word; }
        @media (min-width: 768px) { h2.question-text { font-size: 1.3rem; } }
        
        .options-container { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { 
            background: transparent; 
            color: var(--text); 
            border: 2px solid #444; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 0.95rem; 
            transition: all 0.2s ease; 
            word-break: break-word;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); color: #fff; }
        .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--error); color: #fff; }
        
        .feedback { text-align: center; margin-top: 15px; font-weight: bold; font-size: 1.1rem; min-height: 40px; }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }
        .feedback-correct-text { font-size: 0.9rem; color: #ccc; font-weight: normal; display: block; margin-top: 5px; }
        
        .footer-controls { margin-top: 1.5rem; display: flex; justify-content: space-between; gap: 10px; }
        .footer-controls button { width: auto; flex: 1; }
    </style>
</head>
<body>
    <div class="container" id="view-init">
        <h1>🦇 Cuestionario Desarrollo Seguro 🦇</h1>
        
        <input type="file" id="jsonInput" accept=".json" class="hidden">
        <button class="btn-secondary" style="border-color: var(--success); color: var(--success);" onclick="document.getElementById('jsonInput').click()">
            📥 Subir archivo 'respuestas.json'
        </button>

        <div id="storage-notice" class="hidden" style="background: rgba(34, 197, 94, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--success); text-align: center;">
            <p style="margin: 0 0 10px 0; font-size: 0.9rem;">¡Tienes respuestas guardadas!</p>
            <button class="btn-secondary" onclick="irAEstudio()">Estudiar respuestas guardadas</button>
            <button class="btn-secondary" onclick="irAConfiguracion()">Revisar configuración</button>
            <button class="btn-secondary" style="border-color: var(--error); color: #faa;" onclick="borrarDatos()">Borrar todo</button>
        </div>
        
        <div id="input-section">
            <p class="subtitle">Sube tu PDF para extraer las preguntas o carga tu JSON de respuestas.</p>
            <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
                📄 Toca aquí o arrastra tu PDF
            </div>
        </div>
    </div>

    <div class="container hidden" id="view-setup">
        <h1>Clave de Respuestas 🔑</h1>
        <p class="subtitle">Verifica tus respuestas o cárgalas con el archivo JSON.</p>
        <div class="setup-list" id="setupList"></div>
        <button class="btn-action" onclick="guardarYEstudiar()">Guardar y Estudiar 🖤</button>
        <button class="btn-secondary" onclick="location.reload()">Volver al Inicio</button>
    </div>

    <div class="container hidden" id="view-quiz" style="text-align: left;">
        <div class="score-panel" id="scoreDisplay">Pregunta 1 de ? | Aciertos: 0</div>
        <h2 class="question-text" id="questionText"></h2>
        <div class="options-container" id="optionsContainer"></div>
        <div id="feedbackText" class="feedback"></div>
        <div class="footer-controls">
            <button class="btn-secondary" onclick="location.reload()">Salir</button>
            <button class="btn-secondary hidden" style="background: var(--primary); border-color: var(--primary);" id="nextBtn" onclick="siguientePregunta()">Siguiente 🦇</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let preguntas = [];
        let preguntasQuiz = [];
        let actual = 0;
        let aciertos = 0;

        window.onload = function() {
            const guardado = localStorage.getItem('cuestionario_custom_axity_pdf');
            if (guardado) {
                preguntas = JSON.parse(guardado);
                document.getElementById('storage-notice').classList.remove('hidden');
                document.getElementById('input-section').classList.add('hidden');
            }
        };

        document.getElementById('jsonInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    let claves = JSON.parse(event.target.result);
                    let preguntasGuardadas = JSON.parse(localStorage.getItem('cuestionario_custom_axity_pdf') || "[]");
                    
                    if(preguntasGuardadas.length === 0) {
                        alert("Primero sube tu archivo PDF en la app para extraer las preguntas antes de cargar el JSON.");
                        return;
                    }
                    
                    preguntasGuardadas.forEach(p => {
                        let match = claves.find(c => c.id === p.id);
                        if(match) p.respuestaCorrecta = match.respuestaCorrecta;
                    });
                    
                    localStorage.setItem('cuestionario_custom_axity_pdf', JSON.stringify(preguntasGuardadas));
                    alert("¡Las 258 respuestas se cargaron con éxito! 🎉");
                    location.reload();
                } catch(err) {
                    alert("Error procesando el archivo JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        });

        function borrarDatos() {
            if(confirm("¿Estás segura de borrar todo tu progreso?")) {
                localStorage.removeItem('cuestionario_custom_axity_pdf');
                location.reload();
            }
        }

        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length) procesarPDF(e.dataTransfer.files[0]);
        });

        document.getElementById('pdfInput').addEventListener('change', function(e) {
            if(e.target.files.length) procesarPDF(e.target.files[0]);
        });

        async function procesarPDF(file) {
            if(file.type !== 'application/pdf') return alert('Por favor sube un archivo PDF válido.');
            dropZone.innerHTML = "✨ Extrayendo preguntas... 🦇";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let textoExtraido = "";

                for(let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    let lastY = -1;
                    for(let item of textContent.items) {
                        if(lastY !== -1 && Math.abs(lastY - item.transform[5]) > 5) {
                            textoExtraido += "\n";
                        }
                        textoExtraido += item.str;
                        lastY = item.transform[5];
                    }
                    textoExtraido += "\n";
                }
                parsearTexto(textoExtraido);
            } catch(error) {
                alert("Hubo un error leyendo el PDF: " + error.message);
                dropZone.innerHTML = "📄 Toca aquí o arrastra tu PDF";
            }
        }

        function parsearTexto(texto) {
            const fragmentos = texto.split(/\n\s*(?=\d+\s*[\.\-\)])/);
            preguntas = [];
            
            fragmentos.forEach(frag => {
                if(!frag.trim()) return;
                const lineas = frag.trim().split('\n');
                const matchPregunta = lineas[0].match(/^(\d+)\s*[\.\-\)]\s*(.*)/);
                
                if(matchPregunta) {
                    const id = matchPregunta[1];
                    let preguntaTexto = matchPregunta[2];
                    let i = 1;
                    while(i < lineas.length && !/^\s*[a-z]\s*[\.\-\)]/i.test(lineas[i])) {
                        preguntaTexto += " " + lineas[i];
                        i++;
                    }
                    
                    let restoTexto = lineas.slice(i).join('\n');
                    const RegexOpciones = /([a-z])\s*[\.\-\)]\s+(.*?)(?=\n\s*[a-z]\s*[\.\-\)]|$)/gsi;
                    let opciones = [];
                    let matchOpt;
                    
                    while ((matchOpt = RegexOpciones.exec(restoTexto)) !== null) {
                        opciones.push({ letra: matchOpt[1].toLowerCase(), texto: matchOpt[2].replace(/\n/g, ' ').trim() });
                    }
                    
                    if(!preguntaTexto.includes("GUÍA DE ESTUDIO") && opciones.length > 0) {
                        preguntas.push({ id: parseInt(id), pregunta: preguntaTexto.trim(), opciones, respuestaCorrecta: null });
                    }
                }
            });

            preguntas.sort((a,b) => a.id - b.id);

            if(preguntas.length > 0) {
                guardarEnStorage();
                irAConfiguracion();
            } else {
                alert("No pude detectar el formato de preguntas.");
                dropZone.innerHTML = "📄 Toca aquí o arrastra tu PDF";
            }
        }

        function guardarEnStorage() {
            localStorage.setItem('cuestionario_custom_axity_pdf', JSON.stringify(preguntas));
        }

        function irAConfiguracion() {
            document.getElementById('view-init').classList.add('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
            
            const lista = document.getElementById('setupList');
            lista.innerHTML = '';
            
            preguntas.forEach((p, index) => {
                let div = document.createElement('div');
                div.className = 'setup-item';
                
                let qText = document.createElement('div');
                qText.className = 'setup-question';
                qText.innerText = `${p.id}. ${p.pregunta}`;
                div.appendChild(qText);
                
                let optContainer = document.createElement('div');
                optContainer.className = 'setup-options';
                
                p.opciones.forEach(opt => {
                    let label = document.createElement('label');
                    let radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q_${index}`;
                    radio.value = opt.letra;
                    
                    if(p.respuestaCorrecta === opt.letra) radio.checked = true;
                    
                    radio.addEventListener('change', (e) => {
                        preguntas[index].respuestaCorrecta = e.target.value;
                        guardarEnStorage();
                    });
                    
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(` ${opt.letra}) ${opt.texto}`));
                    optContainer.appendChild(label);
                });
                
                div.appendChild(optContainer);
                lista.appendChild(div);
            });
        }

        function guardarYEstudiar() {
            irAEstudio();
        }

        function irAEstudio() {
            preguntasQuiz = preguntas.filter(p => p.respuestaCorrecta !== null);
            
            if(preguntasQuiz.length === 0) {
                alert("¡No has marcado ninguna respuesta correcta o subido el JSON!");
                return;
            }

            document.getElementById('view-init').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            
            actual = 0;
            aciertos = 0;
            mostrarPregunta();
        }

        function mostrarPregunta() {
            const p = preguntasQuiz[actual];
            document.getElementById('scoreDisplay').innerText = `Estudiando (${preguntasQuiz.length}) | Aciertos: ${aciertos}`;
            document.getElementById('questionText').innerText = `${p.id}. ${p.pregunta}`;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('feedbackText').innerHTML = '';
            document.getElementById('feedbackText').className = 'feedback';
            
            p.opciones.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.id = 'opt-' + index;
                btn.innerText = `${opt.letra}) ${opt.texto}`;
                btn.onclick = () => seleccionar(btn, opt.letra, p.respuestaCorrecta, index, p.opciones);
                container.appendChild(btn);
            });
        }

        function seleccionar(btn, letraSeleccionada, letraCorrecta, selectedIndex, opciones) {
            const container = document.getElementById('optionsContainer');
            Array.from(container.children).forEach(b => b.disabled = true);
            
            const feedback = document.getElementById('feedbackText');
            
            if (letraSeleccionada === letraCorrecta) {
                btn.classList.add('correct');
                feedback.innerHTML = "¡Correcto! 🦇✨";
                feedback.className = 'feedback success';
                aciertos++;
            } else {
                btn.classList.add('incorrect');
                let opcionCorrectaObj = opciones.find(o => o.letra === letraCorrecta);
                let textoCorrecto = opcionCorrectaObj ? `${opcionCorrectaObj.letra}) ${opcionCorrectaObj.texto}` : letraCorrecta;
                
                feedback.innerHTML = `Incorrecto 🥺 <span class="feedback-correct-text">Era:<br><b>${textoCorrecto}</b></span>`;
                feedback.className = 'feedback error';
                
                opciones.forEach((o, i) => {
                    if (o.letra === letraCorrecta) {
                        document.getElementById('opt-' + i).classList.add('correct');
                    }
                });
            }
            
            document.getElementById('scoreDisplay').innerText = `Estudiando (${preguntasQuiz.length}) | Aciertos: ${aciertos}`;
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function siguientePregunta() {
            actual++;
            if(actual < preguntasQuiz.length) {
                mostrarPregunta();
            } else {
                let porcentaje = Math.round((aciertos / preguntasQuiz.length) * 100);
                document.getElementById('view-quiz').innerHTML = 
                    `<h1 style="text-align:center;">¡Bloque Completado! 🦇</h1>
                     <p class="subtitle" style="text-align:center;">Sesión finalizada con éxito.</p>
                     <div style="text-align:center; font-size: 1.8rem; margin: 20px 0; color: var(--primary);">
                        Calificación: ${aciertos} / ${preguntasQuiz.length} (${porcentaje}%)
                     </div>
                     <div style="text-align:center;">
                        <button class="btn-secondary" style="width:100%;" onclick="location.reload()">Volver al Inicio</button>
                     </div>`;
            }
        }
    </script>
</body>
</html>
